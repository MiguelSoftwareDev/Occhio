services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: occhio-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: occhio
      RABBITMQ_DEFAULT_PASS: occhio_demo
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq_data:
