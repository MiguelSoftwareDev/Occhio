syntax = "proto3";

package occhio.monitor.v1;

service SystemAnalysis {
  rpc StreamProgress(stream SystemSnapshot) returns (stream ProgressEvent);
  rpc AnalyzeProgress(SystemSnapshot) returns (stream ProgressEvent);
  rpc AnalyzeSnapshot(SystemSnapshot) returns (AnalysisResult);
  rpc StreamSnapshots(stream SystemSnapshot) returns (stream AnalysisResult);
}

message SystemSnapshot {
  string host_name = 1;
  string captured_at = 2;
  double cpu_percent = 3;
  double memory_percent = 4;
  uint64 memory_used_bytes = 5;
  uint64 memory_total_bytes = 6;
  double disk_percent = 7;
  uint32 process_count = 8;
  uint64 uptime_seconds = 9;
  repeated ProcessMetric top_processes = 10;
}

message ProcessMetric {
  uint32 pid = 1;
  string name = 2;
  double cpu_percent = 3;
  uint64 memory_bytes = 4;
  double memory_percent = 5;
  bool cpu_measured = 6;
}

message AnalysisResult {
  string analysis_id = 1;
  string host_name = 2;
  string captured_at = 3;
  string analyzed_at = 4;
  double cpu_percent = 5;
  double memory_percent = 6;
  uint64 memory_used_bytes = 7;
  uint64 memory_total_bytes = 8;
  double disk_percent = 9;
  uint32 process_count = 10;
  uint64 uptime_seconds = 11;
  string model = 12;
  string analysis_text = 13;
  double inference_ms = 14;
  string prompt_version = 15;
  repeated ProcessMetric top_processes = 16;
}

message ProgressEvent {
  string stage = 1;
  string status = 2;
  AnalysisResult result = 3;
}
